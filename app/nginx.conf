server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # 注意：nginx 的 add_header 在 location 内会**整体覆盖** server 级声明，
    # 因此每个 location 都显式重复这组安全头，否则会静默丢失。
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 带内容哈希的静态资源：一年长缓存 + immutable
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 入口 HTML 必须每次回源，否则发版后客户端仍加载旧 assets 索引
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 预渲染页优先：构建会为每个路由生成 <route>/index.html。
    # 先试静态文件 → 再试 <route>/index.html（避免 301 到带斜杠目录）→ 最后回落首页。
    # 注意：try_files 命中文件时不会重新匹配 location，所以这里必须自己带 no-cache 头。
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 预渲染出来的 HTML 每次回源，发版后不会残留旧页面
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
