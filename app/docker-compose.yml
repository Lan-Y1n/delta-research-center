services:
  web:
    image: ${IMAGE_NAME:-delta-research-center}:${TAG:-local}
    build:
      context: .
      dockerfile: ${WEB_DOCKERFILE:-Dockerfile}
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nginx:alpine}
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ${API_IMAGE_NAME:-delta-research-center-api}:${TAG:-local}
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PORT: "8090"
      DATA_DIR: /data
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-later}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-please-change-this-session-secret}
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/api/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
