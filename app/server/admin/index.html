<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>德尔塔研究中心 · 内容后台</title>
<link rel="stylesheet" href="/admin/admin.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 4 29 27H3z' fill='none' stroke='%2365C9F4' stroke-width='1.6'/%3E%3C/svg%3E" />
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="login-card">
    <div class="login-brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4 29 27H3z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      <div><b>德尔塔研究中心</b><span>CONTENT TERMINAL</span></div></div>
    <label class="field"><span>账号</span><input name="username" value="lany1n" autocomplete="username" /></label>
    <label class="field"><span>密码</span><input name="password" type="password" autocomplete="current-password" required autofocus /></label>
    <button class="btn primary" type="submit">进入后台</button>
    <p class="login-error" id="login-error" role="alert"></p>
    <p class="login-note">内容改动会立即发布到站点。操作会记入备份目录。</p>
  </form>
</div>

<div id="shell" hidden>
  <header class="topbar">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4 29 27H3z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      <div><b>内容后台</b><span>DELTA RESEARCH CENTER</span></div></div>
    <nav class="tabs" id="tabs">
      <button data-tab="site" class="is-active">站点信息</button>
      <button data-tab="leaders">负责人</button>
      <button data-tab="institutes">研究院所</button>
      <button data-tab="projects">研究项目</button>
      <button data-tab="contact">合作联系</button>
    </nav>
    <div class="topbar-right">
      <span class="save-state" id="save-state">已同步</span>
      <a class="btn ghost" href="/" target="_blank" rel="noreferrer">查看站点</a>
      <button class="btn ghost" id="logout">退出</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="editor" id="editor"></main>
  </div>

  <div class="actionbar">
    <span class="meta" id="meta"></span>
    <div class="actionbar-right">
      <button class="btn ghost" id="revert">放弃修改</button>
      <button class="btn primary" id="save">保存并发布</button>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="/admin/admin.js"></script>
</body>
</html>
