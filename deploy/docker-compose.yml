name: delta-site

# 端口映射：宿主 ${HOST_PORT:-8080} -> 容器 8080（容器内 nginx 固定监听 8080）
# 约定来源：F:\PVE\AGENTS-网络与端口约定.md §4 —— 8080 预留给 VM101 个人网站，
# WAF / Cloudflare Tunnel 上游为 http://192.168.10.60:8080
services:
  web:
    image: ${IMAGE_NAME:-delta-research-center}:${TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nginx:alpine}
    ports:
      - "${HOST_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.centurylinklabs.watchtower.enable: "false"
